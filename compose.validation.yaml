# Dedicated validation instances; never reuse the development Compose project.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travel_planner
      MYSQL_USER: travel
      MYSQL_PASSWORD: ${VALIDATION_DB_PASSWORD:?Use scripts/validation/run-isolated.py}
      MYSQL_ROOT_PASSWORD: ${VALIDATION_ROOT_PASSWORD:?Use scripts/validation/run-isolated.py}
    ports: ["127.0.0.1:54316:3306"]
    volumes:
      - validation-mysql:/var/lib/mysql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u travel --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:57389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:18135:8025", "127.0.0.1:11135:1025"]
volumes:
  validation-mysql:
