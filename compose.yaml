services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travel_planner
      MYSQL_USER: travel
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-local-only-change-me}
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD:-local-root-only}
    ports: ["127.0.0.1:53306:3306"]
    volumes:
      - auth-mysql:/var/lib/mysql
      - ./scripts/auth-init-test-db.sql:/docker-entrypoint-initdb.d/auth-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u travel --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:18025:8025", "127.0.0.1:11025:1025"]
volumes:
  auth-mysql:
