services:
  # Sida Xue — Travel Journal Search：本地开发用 ES 容器。
  elasticsearch:
    profiles: [journal]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19200:9200"]
    mem_limit: 1g
    volumes:
      - journal-es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travel_planner
      MYSQL_USER: travel
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-local-root-only}
    ports: ["127.0.0.1:${DB_PORT:-53306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u travel --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:18025:8025", "127.0.0.1:11025:1025"]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  # Sida Xue — Travel Journal Search：ES 数据持久化卷。
  journal-es:
  mysql-data:
