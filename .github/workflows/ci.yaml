name: Backend CI

on:
  pull_request:
    branches: [test, master]
  push:
    branches: [test, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install smoke test dependencies
        run: python -m pip install -r requirements-smoke.txt

      - name: Start MySQL and Mailpit
        run: docker compose up -d --wait

      - name: Package application
        run: ./mvnw --batch-mode -DskipTests package

      - name: Run HTTP smoke tests
        env:
          DB_PASSWORD: local-only-change-me
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          if ! python scripts/run-smokes.py; then
            cat backend.log
            exit 1
          fi

      - name: Run integration tests
        run: ./mvnw --batch-mode verify
