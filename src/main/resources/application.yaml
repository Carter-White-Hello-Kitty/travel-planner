server:
  port: 8085

spring:
  application:
    name: travel-planner
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:53306}/travel_planner?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:11025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:${GOOGLE_PLACES_API_KEY:}}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    connect-timeout: 2s
    request-timeout: 5s

itinerary:
  generation:
    max-duration: 10m
    processing-ttl: 15m
    completed-ttl: 24h
    rate-limit: 5
    rate-window-seconds: 60

auth:
  origins: ${AUTH_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:true}
  development-keys: ${AUTH_DEV_KEYS:false}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  mail-key: ${AUTH_MAIL_KEY:}
  rate-key: ${AUTH_RATE_KEY:}
  mail-from: ${MAIL_FROM:no-reply@travel-planner.local}
  worker-enabled: true
