server:
  port: 8085
spring:
  application:
    name: travel-planner
  datasource:
    url: jdbc:mysql://localhost:3306/travel-planner?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
